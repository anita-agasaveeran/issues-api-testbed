# Authored with Claude Code (Anthropic) under the direction of Anita Agasaveeran,
# who specified the requirements and design and reviewed the implementation.
# See the "Credits and authorship" section of README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests scripts

      - name: Ruff format check
        run: ruff format --check app tests scripts

      - name: Mypy (strict)
        run: mypy app

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No secrets are needed or available here: integration tests detect the
      # absence of real credentials and skip themselves.
      - name: Run tests with coverage
        run: pytest -m "not integration" --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Validates openapi.yaml and fails if it has drifted from the routes.
      - name: Validate the contract
        run: pytest tests/unit/test_openapi_contract.py -v

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: issues-api-testbed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds but cannot serve a request is not a passing build.
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke \
            -e GITHUB_TOKEN=ci-placeholder \
            -e GITHUB_OWNER=ci \
            -e GITHUB_REPO=ci \
            -e WEBHOOK_SECRET=ci-placeholder \
            -p 8000:8000 \
            issues-api-testbed:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /tmp/health.json; then
              echo "healthy after ${attempt} attempt(s)"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          echo "service did not become healthy" >&2
          docker logs smoke >&2
          exit 1

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Stop the container
        if: always()
        run: docker rm -f smoke || true
